d queries, Top, Rising and Breakout","tags":"飙升 热门 相关查询 相关主题 5000% 选题 拓词 分页","video":3,"at":357,"end":420,"action":"选对种子词的卡片，分别记 Top 和 Rising，并翻查后续页。把高增候选单独查长期走势，按受众、场景和站内证据筛选。","limit":"Rising 对比上一等长时段，Breakout 表示增幅超过 5,000%。低基数可导致高增长百分比。","videoTitle":"Google Trends walkthrough","sourceUrl":"https://www.youtube.com/watch?v=GXpGoUw4YUw&t=357s","endUrl":"https://www.youtube.com/watch?v=GXpGoUw4YUw&t=420s","officialUrl":"https://support.google.com/trends/answer/4355000?hl=en","reviewedOn":"2026-11-18"},{"id":"same-scale","mode":"explore","zh":"在同一请求内比较指数","en":"Same-request scaling","tags":"同图 同一请求 归一 独立图表 不可拼接 对照 比较","video":3,"at":421,"end":465,"action":"把要比较的所有项放入同一张 Explore 图。报告约数和搜索兴趣，并写出筛选口径。批量任务在有授权时另用一致缩放 API。","limit":"两个独立网页 CSV 的 100 可能来自不同峰。指数的百分比变化不可描述成搜索次数增长。","videoTitle":"Google Trends walkthrough","sourceUrl":"https://www.youtube.com/watch?v=GXpGoUw4YUw&t=421s","endUrl":"https://www.youtube.com/watch?v=GXpGoUw4YUw&t=465s","officialUrl":"https://support.google.com/trends/answer/4365533?hl=en","reviewedOn":"2026-11-18"},{"id":"exact-phrase","mode":"compare","zh":"用双引号约束连续词组","en":"Quoted exact phrase","tags":"引号 词组 连续匹配 keyword storage box","video":4,"at":66,"end":108,"action":"用英文半角双引号包住连续词组。研究不确定语序时同图比较带引号和不带引号的写法。","limit":"引号允许词组前后还有其他词。普通多词查询要求词都出现，语序不限。","videoTitle":"Google Trends Advanced Tips","sourceUrl":"https://www.youtube.com/watch?v=Kkd2PkbCdSc&t=66s","endUrl":"https://www.youtube.com/watch?v=Kkd2PkbCdSc&t=108s","officialUrl":"https://support.google.com/trends/answer/4359582?hl=en","reviewedOn":"2026-11-18"},{"id":"plus-minus","mode":"compare","zh":"合并变体或排除歧义词","en":"Plus OR and minus exclusion","tags":"+ - 加号 减号 排除 语法 空格 local translations","video":4,"at":95,"end":151,"action":"用 A + B 将变体并为一项。排除词写成 A -B，减号紧贴词；先小规模验证结果语义。","limit":"按当前 Google 帮助，A - B 的减号会被忽略。并为一项后无法分读两个写法的表现。","videoTitle":"Google Trends Advanced Tips","sourceUrl":"https://www.youtube.com/watch?v=Kkd2PkbCdSc&t=95s","endUrl":"https://www.youtube.com/watch?v=Kkd2PkbCdSc&t
